\* Stage-3 smoke: star tree {n0,n1,n2} + one outside instance. Probes
\* included: violations = legitimate scenarios behind the impl asserts.
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
  Nodes = {n0, n1, n2, n3, n4}
  OwnerSpace = n0
  TreeNodes = {n0, n1, n2}
  SrcRouting = TRUE
  RegClockBump = TRUE
  BoundedLiveness = FALSE
  MaxPacks = 2
  MaxAcqs = 2
  MaxRounds = 4
  MaxSpawns = 1
  RoundTagging = FALSE
  ReceiptChecks = TRUE
  OwnershipVersioning = TRUE
  RestartForwarding = TRUE
  RegistrationGate = TRUE
  RegHandshake = TRUE
  CoveredByHandle = TRUE
  FlagVeto = TRUE
  CatchUp = TRUE
  AcquireMode = "final"
  StaleUpdateProbe = TRUE
  RegRespOwnership = FALSE
INVARIANTS
  AcquireContract
  TypeOK
  SafeRefs
  DiedStaysDead
  DeadOwnerClean
  ValidDeadClean
  OwnerUnique
  StrictLevelOrder
  HandlesCovered
  NoRequestAtBusyNode
  RootRetainsOwnership
