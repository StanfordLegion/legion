\* Current protocol (all toggles off). Model validation: TLC is expected
\* to find violations of SafeRefs / DiedStaysDead (unsolicited-success
\* force-downgrade; update resurrection). If it does not, the model is
\* not faithful enough to trust.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n0, n1, n2}
  OwnerSpace = n0
  TreeNodes = {n0}
  SrcRouting = TRUE
  RegClockBump = FALSE
  BoundedLiveness = FALSE
  MaxPacks = 2
  MaxAcqs = 2
  MaxRounds = 4
  MaxSpawns = 1
  RoundTagging = FALSE
  ReceiptChecks = FALSE
  OwnershipVersioning = FALSE
  RestartForwarding = FALSE
  RegistrationGate = FALSE
  RegHandshake = FALSE
  CoveredByHandle = FALSE
  FlagVeto = FALSE
  CatchUp = TRUE
  AcquireMode = "deny"
  StaleUpdateProbe = TRUE
  RegRespOwnership = TRUE
INVARIANTS
  TypeOK
  SafeRefs
  DiedStaysDead
  DeadOwnerClean
  OwnerUnique
