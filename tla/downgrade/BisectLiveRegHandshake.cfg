\* Liveness for the proposed redesign on a small config: once bounded
\* reference creation stops, everything is eventually collected.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n0, n1, n2}
  OwnerSpace = n0
  TreeNodes = {n0}
  SrcRouting = TRUE
  RegClockBump = FALSE
  BoundedLiveness = FALSE
  MaxPacks = 1
  MaxAcqs = 1
  MaxRounds = 8
  MaxSpawns = 1
  RoundTagging = FALSE
  ReceiptChecks = TRUE
  OwnershipVersioning = TRUE
  RestartForwarding = TRUE
  RegistrationGate = TRUE
  RegHandshake = FALSE
  CoveredByHandle = TRUE
  FlagVeto = TRUE
  CatchUp = TRUE
  AcquireMode = "final"
  StaleUpdateProbe = TRUE
  RegRespOwnership = FALSE
PROPERTIES
  EventualCollection
