\* Item 1 of the closing pass: a DEPTH-2 collective tree so the
\* interior-node subtree-skip is actually exercised (a VALID interior
\* node fails the round WITHOUT forwarding; its child goes unasked and
\* the failure resolves the whole subtree from the wait set). The
\* 3-node tree that passed exhaustively only had leaf children.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n0, n1, n2, n3}
  Owner = n0
  TreeNodes = {n0, n1, n2, n3}
  MaxAcqs = 2
  MaxPacks = 2
  MaxRounds = 2
  MaxSpawns = 0
  MaxUsers = 1
  ClockCheck = TRUE
  ContractHeld = TRUE
  SpawnPoison = TRUE
  SeparateAccums = TRUE
  RecordCover = TRUE
  WaiterFix = TRUE
INVARIANTS
  TypeOK
  NoFatal
  RefsImplyValid
  SafeDeletion
  UsersGathered
  DeadStaysDead
